name: Editor release

on:
  push:
    tags:
      - 'editor-v*'

# Builds never receive a write token; only the final gated publishing job does.
permissions:
  contents: read

concurrency:
  group: editor-release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_VERSION: '6.11.3'
  AQT_VERSION: '3.3.0'

jobs:
  prepare:
    name: Validate tag, checks and Qt licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate release tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, runpy
          tag = os.environ['TAG']
          if not tag.startswith('editor-v'):
              raise SystemExit('Expected editor-vX.Y.Z[-prerelease]')
          version = tag.removeprefix('editor-v')
          runpy.run_path('scripts/package_editor_windows.py')['version_number'](version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nprerelease={str("-" in version).lower()}\n')
          PY
      - name: Repository and packaging guard tests
        run: |
          python scripts/check_project.py
          python -m unittest discover -s scripts/tests -v
          bash -n app/ahk/tests/run.sh
          python -Werror scripts/package_editor_windows.py --self-test
          python -m py_compile scripts/package_editor_windows.py scripts/package_editor_macos.py scripts/test_editor_updater_macos.py scripts/generate_editor_icons.py
          sh -n app/editor/resources/update/replace-macos.sh
          git diff --check
      - name: Prepare pinned Qt sources, licenses and third-party notices
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, os, shutil, tarfile, urllib.request
          version = os.environ['QT_VERSION']
          root = Path('.runtime/editor/release-inputs')
          licenses = root / 'licenses'
          licenses.mkdir(parents=True)
          provenance = []
          # Official source checksums pinned for both dynamically linked modules.
          for module, expected in {
              'qtbase': '46de0710b594945a5d446ae44354daa386141c6903c53781b2ca547bc62f8f8f',
              'qtsvg': '9bdf6fa4b5a2d91c3eaa2edd12263fdff0ae19d0ac25d3c99946cd4189a07123',
          }.items():
              filename = f'{module}-everywhere-src-{version}.tar.xz'
              url = f'https://download.qt.io/official_releases/qt/6.11/{version}/submodules/{filename}'
              archive = root / filename
              with urllib.request.urlopen(url, timeout=120) as response, archive.open('wb') as out:
                  shutil.copyfileobj(response, out)
              with archive.open('rb') as stream:
                  actual = hashlib.file_digest(stream, 'sha256').hexdigest()
              if actual != expected:
                  raise SystemExit(f'Qt source checksum mismatch: {actual}')
              count = 0
              with tarfile.open(archive, 'r:xz') as source:
                  for entry in source:
                      path = PurePosixPath(entry.name)
                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(f'Unsafe source member: {entry.name}')
                      # Preserve full upstream-relative paths, including all bundled third-party texts.
                      selected = (path.name.lower().startswith(('license', 'licence', 'copying', 'copyright', 'notice'))
                                  or 'LICENSES' in path.parts or path.name == 'qt_attribution.json')
                      if entry.isfile() and selected:
                          destination = licenses / module / Path(*path.parts[1:])
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          with source.extractfile(entry) as inp, destination.open('wb') as out:
                              shutil.copyfileobj(inp, out)
                          count += 1
              if count < (20 if module == 'qtbase' else 3):
                  raise SystemExit('Qt license/attribution collection is unexpectedly incomplete')
              provenance.append(f'Original unmodified source: {url}\nSHA-256: {expected}\n')
              print(f'Collected {count} {module} license/attribution files; verified {filename}')
          shutil.copytree('LICENSES', licenses / 'project')
          shutil.copy2('THIRD_PARTY_NOTICES.md', licenses / 'THIRD_PARTY_NOTICES.md')
          (licenses / 'QT-SOURCE.txt').write_text(
              f'Qt {version}, dynamically linked Qt Base + SVG (Core/Gui/Widgets/Svg and platform/image/icon plugins).\n'
              + ''.join(provenance) +
              f'The same source archives are assets on this editor release:\n'
              f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/tag/{os.environ["GITHUB_REF_NAME"]}\n'
              'Qt is used under LGPLv3; GPLv3 and LGPLv3 texts and third-party notices are included.\n'
              'You may replace the dynamically linked Qt libraries with compatible modified builds;\n'
              'reverse engineering for debugging such modifications is not prohibited by this notice.\n'
              'The source archive includes Qt build instructions and third-party source code.\n'
              'No application-wide license grant is implied by third-party license texts.\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editor-licenses
          path: .runtime/editor/release-inputs/licenses/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editor-release-qt-source
          path: |
            .runtime/editor/release-inputs/qtbase-everywhere-src-6.11.3.tar.xz
            .runtime/editor/release-inputs/qtsvg-everywhere-src-6.11.3.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            asset_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      TARGET_ARCH: ${{ matrix.arch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: editor-licenses
          path: .runtime/editor/release-inputs/licenses
      - name: Install official universal Qt Base + SVG SDK
        run: |
          test "$(uname -m)" = "$TARGET_ARCH"
          xcodebuild -version
          python -m pip install "aqtinstall==$AQT_VERSION"
          mkdir -p .runtime/editor
          # aqt also writes its diagnostic log in the current directory.
          pushd .runtime/editor >/dev/null
          python -m aqt install-qt mac desktop "$QT_VERSION" clang_64 --archives qtbase qtsvg -O qt
          popd >/dev/null
          echo "QT_PREFIX=$GITHUB_WORKSPACE/.runtime/editor/qt/$QT_VERSION/macos" >> "$GITHUB_ENV"
      - name: Build editor and run CTest
        run: |
          cmake -S app/editor -B .runtime/editor/build -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES="$TARGET_ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DD4BOX_RELEASE_VERSION="$RELEASE_VERSION"
          cmake --build .runtime/editor/build --parallel 3
          ctest --test-dir .runtime/editor/build --output-on-failure
      - name: Package, audit and test native app
        run: |
          python scripts/package_editor_macos.py \
            --build-dir .runtime/editor/build --qt-prefix "$QT_PREFIX" \
            --arch "$TARGET_ARCH" --release-version "$RELEASE_VERSION" \
            --licenses-dir .runtime/editor/release-inputs/licenses \
            --output-dir .runtime/editor/dist-macos
          python scripts/check_editor_cli.py .runtime/editor/dist-macos/D4BoxEditor.app/Contents/MacOS/D4BoxEditor
          python scripts/test_editor_updater_macos.py --app .runtime/editor/dist-macos/D4BoxEditor.app
      - name: Create real DMG and verify extracted ZIP and mounted DMG
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/.runtime/editor/dist-macos"
          assets="$GITHUB_WORKSPACE/.runtime/editor/assets"
          stem="D4BoxEditor-$RELEASE_VERSION-macos-$ASSET_ARCH"
          mkdir -p "$assets" "$dist/dmg-root"
          mv "$dist/D4BoxEditor-macos.zip" "$assets/$stem.zip"
          cp "$dist/size-report.json" "$assets/$stem-report.json"
          ditto "$dist/D4BoxEditor.app" "$dist/dmg-root/D4BoxEditor.app"
          ln -s /Applications "$dist/dmg-root/Applications"
          hdiutil create -volname 'D4Box Editor' -srcfolder "$dist/dmg-root" \
            -format UDZO "$assets/$stem.dmg"
          hdiutil verify "$assets/$stem.dmg"
          mount="$(mktemp -d)"
          extracted="$(mktemp -d)"
          trap 'hdiutil detach "$mount" || true; rm -rf "$mount" "$extracted"' EXIT
          hdiutil attach "$assets/$stem.dmg" -readonly -nobrowse -mountpoint "$mount"
          ditto -x -k "$assets/$stem.zip" "$extracted"
          for root in "$mount" "$extracted"; do
            codesign --verify --deep --strict "$root/D4BoxEditor.app"
            env -i HOME="$HOME" TMPDIR="$TMPDIR" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
              "$root/D4BoxEditor.app/Contents/MacOS/D4BoxEditor" --smoke-test
          done
          hdiutil detach "$mount"
          rm -rf "$mount" "$extracted"
          trap - EXIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editor-release-macos-${{ matrix.asset_arch }}
          path: .runtime/editor/assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Collect native startup crash diagnostics
        if: failure()
        run: |
          python scripts/diagnose_editor_macos.py --build-dir .runtime/editor/build --package-dir .runtime/editor/dist-macos --output-dir .runtime/editor/diagnostics
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: editor-diagnostics-macos-${{ matrix.asset_arch }}
          path: .runtime/editor/diagnostics/
          if-no-files-found: warn
          retention-days: 7

  windows:
    name: Windows x64 MSVC 2022
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: editor-licenses
          path: .runtime/editor/release-inputs/licenses
      - name: Initialize official MSVC x64 environment
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 C++ tools not found' }
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          # PowerShell invokes the official script directly, so spaces in Program Files
          # never pass through cmd.exe's /s /c quoting rules.
          $devShell = Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1'
          if (!(Test-Path $devShell)) { throw 'Visual Studio Developer PowerShell script not found' }
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if ($env:VSCMD_ARG_TGT_ARCH -notin @('x64', 'amd64')) {
            throw 'Visual Studio did not initialize an x64 target environment'
          }
          Get-Command cl.exe, link.exe, dumpbin.exe -ErrorAction Stop | Format-Table Name, Source
          Get-ChildItem Env: | ForEach-Object {
            $name, $value = $_.Name, $_.Value
            if ($name -notmatch '^(GITHUB_|RUNNER_|ACTIONS_|NODE_OPTIONS$)' -and
                (!$before.ContainsKey($name) -or $before[$name] -cne $value)) {
              "$name=$value" >> $env:GITHUB_ENV
            }
          }
      - name: Install official Qt Base + SVG MSVC SDK
        run: |
          # Qt 6.11 split Windows repositories by compiler; aqt 3.3.0 uses the old URL.
          # Use the official qtbase/qtsvg archives, pinned SHA-256, and runner-provided 7-Zip.
          $prefix = "$env:GITHUB_WORKSPACE/.runtime/editor/qt/$env:QT_VERSION/msvc2022_64"
          $sevenzip = "$env:ProgramFiles\7-Zip\7z.exe"
          if (!(Test-Path $sevenzip)) { throw 'Runner must provide 7-Zip' }
          python scripts/package_editor_windows.py --fetch-qt --qt-prefix $prefix --sevenzip $sevenzip
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK install failed' }
          "QT_PREFIX=$prefix" >> $env:GITHUB_ENV
          "$prefix/bin" >> $env:GITHUB_PATH
      - name: Build editor and run CTest
        run: |
          cmake -S app/editor -B .runtime/editor/build -G Ninja `
            -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_TESTING=ON `
            "-DCMAKE_PREFIX_PATH=$env:QT_PREFIX" "-DD4BOX_RELEASE_VERSION=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build .runtime/editor/build --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed' }
          ctest --test-dir .runtime/editor/build --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed' }
      - name: Package and test portable ZIP and Inno Setup installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Runner must provide Inno Setup 6; no placeholder installers' }
          $crt = Join-Path $env:VCToolsRedistDir 'x64\Microsoft.VC143.CRT'
          python scripts/package_editor_windows.py --build-dir .runtime/editor/build `
            --qt-prefix $env:QT_PREFIX --qt-version $env:QT_VERSION --crt-dir $crt `
            --licenses-dir .runtime/editor/release-inputs/licenses --version $env:RELEASE_VERSION `
            --iscc $iscc --dumpbin (Get-Command dumpbin.exe).Source --output-dir .runtime/editor/assets
          if ($LASTEXITCODE -ne 0) { throw 'Windows deployment/installer verification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: editor-release-windows-x64
          path: .runtime/editor/assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish only the complete tested editor release
    needs: [prepare, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: editor-release-*
          path: assets
          merge-multiple: true
      - name: Verify exact asset set and generate SHA-256 checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path('assets')
          version = os.environ['RELEASE_VERSION']
          expected = {f'{module}-everywhere-src-{os.environ["QT_VERSION"]}.tar.xz'
                      for module in ('qtbase', 'qtsvg')}
          for platform, suffixes in [('windows-x64', ['.zip', '-setup.exe', '-report.json']),
                                     ('macos-arm64', ['.zip', '.dmg', '-report.json']),
                                     ('macos-x64', ['.zip', '.dmg', '-report.json'])]:
              expected.update(f'D4BoxEditor-{version}-{platform}{suffix}' for suffix in suffixes)
          actual = {p.name for p in root.iterdir()}
          if actual != expected:
              raise SystemExit(f'Asset mismatch: missing={expected-actual}; unexpected={actual-expected}')
          lines = []
          for name in sorted(expected):
              path = root / name
              if not path.is_file() or path.stat().st_size < (100 if name.endswith('.json') else 100000):
                  raise SystemExit(f'Empty/placeholder asset: {name}')
              with path.open('rb') as stream:
                  lines.append(f'{hashlib.file_digest(stream, "sha256").hexdigest()}  {name}\n')
          (root / 'SHA256SUMS.txt').write_text(''.join(lines))
          PY
          (cd assets && sha256sum --check SHA256SUMS.txt)
      - name: Upload to draft, verify remote assets, then publish
        run: |
          set -euo pipefail
          # Lookup distinguishes a missing release (404) from authentication/network errors.
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          url = f'{os.environ["GITHUB_API_URL"]}/repos/{os.environ["GH_REPO"]}/releases/tags/{os.environ["TAG"]}'
          request = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              release = None
          if release and not release['draft']:
              raise SystemExit('Refusing to overwrite an already published release; use a new tag.')
          with open('release-exists.txt', 'w') as out:
              out.write('yes' if release else 'no')
          PY
          cat > release-notes.md <<'NOTES'
          Standalone C++ / Qt Widgets editor only. Edits draft JSON; no AHK runtime,
          game workflow execution or game input is included.

          Changes in this release:
          - Keep the workflow panel scrollbar hidden when the panel first opens.
          - Reveal it on pointer entry or scrolling, then fade it when idle.

          - Windows x64: extract the entire ZIP or use the per-user Inno Setup installer.
          - macOS 13+: choose arm64 for Apple Silicon or x64 for Intel; ZIP and real DMG supplied.
          - Editor updates can be checked from More without GitHub CLI or login.
            Versions 0.2.4 and earlier require a manual update if `gh` is unavailable.
          - Windows packages are unsigned; macOS apps are ad-hoc signed, not Developer-ID signed/notarized.
            SmartScreen/Gatekeeper may block first launch. No signing secrets are used.
          - Qt 6.11.3 LGPL/GPL and bundled third-party notices are included in each package;
            the matching unmodified Qt Base + SVG source archives are attached for library modifications.
          - SHA256SUMS.txt covers every download. Build/runtime audits are in the JSON reports.

          Native CI builds, CTest and packaged smoke tests passed for all three targets before publication.
          This does not establish clean-machine installation, minimum-OS or live-game validation.
          NOTES
          if [ "$(cat release-exists.txt)" = no ]; then
            gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" --draft \
              --title "D4Box Editor $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release view "$TAG" --json assets > remote-assets.json
          python - <<'PY'
          from pathlib import Path
          import json
          local = {p.name: p.stat().st_size for p in Path('assets').iterdir()}
          remote = {a['name']: a['size'] for a in json.loads(Path('remote-assets.json').read_text())['assets']}
          if local != remote:
              raise SystemExit('Remote draft asset set/sizes differ; leaving release unpublished.')
          PY
          latest=false
          if [ "$PRERELEASE" = false ]; then latest=true; fi
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest" \
            --title "D4Box Editor $RELEASE_VERSION" --notes-file release-notes.md
